plugins {
    id 'idea'
    id 'com.diffplug.spotless' version '8.8.0' apply false
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

idea {
    module {
        // Exclude generated/cache directories that IntelliJ should not index.
        excludeDirs += [
            file('.gradle'),
            file('.claude'),
            file('build'),
        ]
    }
}

subprojects {
    apply plugin: 'idea'
    idea {
        module {
            excludeDirs += [file('build')]
        }
    }

    apply plugin: 'com.diffplug.spotless'

    plugins.withId('java') {
        spotless {
            java {
                // Pinned below 1.35.0: 1.28.0+ references javac-internal classes (e.g.
                // com.sun.tools.javac.tree.JCTree$JCAnyPattern) that are unresolvable via
                // --add-exports on any locally available JDK — verified identical failure on
                // 17/21/25, so this is a broken artifact, not a JDK-version incompatibility.
                // 1.22.0 is the newest release confirmed to run cleanly with no extra JVM args.
                googleJavaFormat('1.22.0').aosp()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }
}