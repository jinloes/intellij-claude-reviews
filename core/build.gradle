plugins {
    id 'java-library'
}

group = 'com.jinloes.prpilot'
version = '1.0.0'

repositories {
    mavenCentral()
}

// core is a plain Java 17 module: all shared models are plain Java so downstream Java modules
// don't need Kotlin-Java interop shims (no jackson-module-kotlin, no @JvmOverloads/@JvmStatic).
// DiffParser was converted from Kotlin to Java once the sidecar (Java) replaced the old
// Kotlin/JS multiplatform target as VS Code's integration path, removing the last reason to keep
// any part of this module in Kotlin.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
