plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

group = 'com.jinloes.claudereviews'
version = '1.0.0'

repositories {
    mavenCentral()
}

kotlin {
    jvm {
        compilations.main.compileTaskProvider.configure {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            }
        }
        compilations.test.compileTaskProvider.configure {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            }
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
            }
        }

        commonTest {
            dependencies {
                implementation 'io.kotest:kotest-framework-engine:6.1.11'
                implementation 'io.kotest:kotest-assertions-core:6.1.11'
            }
        }


        jvmTest {
            dependencies {
                implementation 'io.kotest:kotest-runner-junit5:6.1.11'
                implementation kotlin('reflect')
            }
        }

    }
}

// Ensure the jvmTest task uses JUnit Platform.
tasks.named('jvmTest', Test) {
    useJUnitPlatform()
}

// Keep Java compilation at Java 17.
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.encoding = 'UTF-8'
}

